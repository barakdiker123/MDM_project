[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdm"
version = "1.0.0"
description = "Measurement Difference Method for noise covariance identification (Kost et al., IEEE TAC 2026), in paper notation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
neural = ["torch>=2.0"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["mdm", "mdm.neural"]
